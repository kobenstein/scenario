<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      Style test A — "Kinetic Documentary"
      Motion DNA: calm + sharp. Long expo-out landings, slow camera glides, 3-5x speed contrast on accents.
      Through-line: the scenario year counter is the carrier. It lands, becomes the stamp top-left,
      the camera falls into a point-cloud Vienna, one warm window goes dark, the city's points rise
      and assemble into a cyan iris that opens above everything. Wow moment: the iris opening on "see".
      Palette: near-black #06070a, cool cyan #6fe3ff (machine), warm amber #ffb35c (human), neutral #c9d1dc.
    -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; src: url(assets/InstrumentSerif.woff2) format("woff2"); font-display: block; }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(assets/InstrumentSerif-400-italic.woff2) format("woff2"); font-display: block; }
      @font-face { font-family: "Inter"; src: url(assets/Inter-400-normal.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06070a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #06070a; }
      #gl, #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #grain { opacity: 1; pointer-events: none; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      #year { position: absolute; left: 0; top: 0; font-family: "Instrument Serif", serif; color: #e9eef5;
        font-size: 300px; line-height: 1; letter-spacing: -0.02em; display: flex; transform-origin: 0 0; }
      .digit { height: 300px; overflow: hidden; }
      .col { display: flex; flex-direction: column; }
      .col span { height: 300px; display: block; }
      #yearLabel { position: absolute; left: 96px; top: 182px; font-family: "Inter", sans-serif; font-size: 22px;
        letter-spacing: 0.32em; text-transform: uppercase; color: #8b96a6; overflow: hidden; }
      #yearLabel span { display: inline-block; }
      #tag { position: absolute; font-family: "Inter", sans-serif; color: #ffcf96; font-size: 22px; letter-spacing: 0.04em; white-space: nowrap; }
      #tag .rule { position: absolute; left: -132px; top: 14px; width: 116px; height: 1px; background: #ffb35c; transform-origin: 100% 50%; }
      #tag .t { display: inline-block; overflow: hidden; }
      #tag .t span { display: inline-block; }
      #tag .sub { display: block; color: #8b96a6; font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip" data-start="0" data-duration="15" width="1920" height="1080"></canvas>
      <div id="vignette" class="clip" data-start="0" data-duration="15"></div>
      <div id="tag" class="clip" data-start="0" data-duration="15">
        <div class="rule"></div>
        <div class="t"><span>The last human radiologist</span></div>
        <span class="sub"><span class="t"><span>Vienna General Hospital, 7th floor</span></span></span>
      </div>
      <div id="year" class="clip" data-start="0" data-duration="15">
        <div class="digit"><div class="col"><span>2</span></div></div>
        <div class="digit"><div class="col"><span>0</span></div></div>
        <div class="digit"><div class="col" id="tens"><span>2</span><span>3</span></div></div>
        <div class="digit"><div class="col" id="ones"><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span><span>1</span></div></div>
      </div>
      <div id="yearLabel" class="clip" data-start="0" data-duration="15"><span>Scenario · Vienna</span></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="15" width="480" height="270"></canvas>
    </div>

    <script type="importmap">{ "imports": { "three": "./assets/three.module.min.js" } }</script>
    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "./assets/jsm/postprocessing/EffectComposer.js";
      import { RenderPass } from "./assets/jsm/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "./assets/jsm/postprocessing/UnrealBloomPass.js";
      import { ShaderPass } from "./assets/jsm/postprocessing/ShaderPass.js";
      import { CopyShader } from "./assets/jsm/shaders/CopyShader.js";

      // ---------- deterministic helpers ----------
      let seed = 1337;
      const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
      const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const inOut = (x) => (x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2);
      const lerp = (a, b, t) => a + (b - a) * t;
      const VO = 0.6; // voice-over offset in seconds

      // ---------- renderer ----------
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.setClearColor(0x06070a, 1);
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x06070a, 0.0034);
      const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.1, 2000);
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1); composer.setSize(1920, 1080);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(1920, 1080), 0.55, 0.5, 0.35);
      composer.addPass(bloom);
      composer.addPass(new ShaderPass(CopyShader));

      // ---------- point shader (soft discs, size attenuation, per-point colour + alpha) ----------
      const pointMat = (additive) => new THREE.ShaderMaterial({
        transparent: true, depthWrite: false,
        blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
        uniforms: { uOpacity: { value: 1 }, uFogDensity: { value: 0.0034 } },
        vertexShader: `
          attribute float size; attribute vec3 color; attribute float alpha;
          varying vec3 vColor; varying float vAlpha;
          uniform float uFogDensity;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = min(size * (900.0 / -mv.z), 22.0);
            float d = -mv.z; float fog = exp(-uFogDensity * uFogDensity * d * d);
            vColor = color; vAlpha = alpha * fog * 1.35;
          }`,
        fragmentShader: `
          uniform float uOpacity; varying vec3 vColor; varying float vAlpha;
          void main() {
            vec2 c = gl_PointCoord - 0.5; float r = length(c);
            float a = smoothstep(0.5, 0.0, r);
            gl_FragColor = vec4(vColor, a * vAlpha * uOpacity);
          }`,
      });

      // ---------- point-cloud Vienna ----------
      const COOL = new THREE.Color("#b4c6da"), DIM = new THREE.Color("#5b6b80"), CYAN = new THREE.Color("#6fe3ff");
      const HERO = { x: 6, z: -4, w: 9, d: 7, h: 26 };
      const buildings = [];
      for (let gx = -11; gx <= 11; gx++) for (let gz = -11; gz <= 6; gz++) {
        if (rand() < 0.18) continue; // squares & streets
        const w = 4 + rand() * 4, d = 4 + rand() * 4;
        const dist = Math.hypot(gx, gz);
        const h = 4 + rand() * 10 + Math.max(0, 14 - dist) * rand() * 1.4;
        buildings.push({ x: gx * 11 + (rand() - 0.5) * 2, z: gz * 11 + (rand() - 0.5) * 2, w, d, h });
      }
      // keep the hero block clear
      for (let i = buildings.length - 1; i >= 0; i--) { const b = buildings[i]; if (Math.abs(b.x - HERO.x) < 10 && Math.abs(b.z - HERO.z) < 10) buildings.splice(i, 1); }
      buildings.push(HERO);

      const cityPos = [], cityCol = [], citySize = [], cityAlpha = [];
      const addPt = (x, y, z, col, s, a) => { cityPos.push(x, y, z); cityCol.push(col.r, col.g, col.b); citySize.push(s); cityAlpha.push(a); };
      for (const b of buildings) {
        const isHero = b === HERO;
        const step = 1.15;
        // vertical edges
        for (const [ex, ez] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) for (let y = 0; y <= b.h; y += step * 0.8)
          addPt(b.x + ex * b.w / 2, y, b.z + ez * b.d / 2, COOL, isHero ? 0.55 : 0.42, 0.85);
        // roof outline
        for (let u = -b.w / 2; u <= b.w / 2; u += step * 0.7) { addPt(b.x + u, b.h, b.z - b.d / 2, COOL, 0.42, 0.9); addPt(b.x + u, b.h, b.z + b.d / 2, COOL, 0.42, 0.9); }
        for (let v = -b.d / 2; v <= b.d / 2; v += step * 0.7) { addPt(b.x - b.w / 2, b.h, b.z + v, COOL, 0.42, 0.9); addPt(b.x + b.w / 2, b.h, b.z + v, COOL, 0.42, 0.9); }
        // sparse facade windows
        for (let y = 2; y < b.h - 1; y += 2.2) for (let u = -b.w / 2 + 1; u < b.w / 2 - 0.5; u += 1.6) {
          if (rand() < 0.55) addPt(b.x + u, y, b.z + b.d / 2, DIM, 0.3, 0.7);
          if (rand() < 0.35) addPt(b.x + b.w / 2, y, b.z + u * (b.d / b.w), DIM, 0.3, 0.6);
        }
      }
      // ground grid (streets)
      for (let x = -130; x <= 130; x += 2.6) for (let z = -130; z <= 75; z += 11) addPt(x, 0, z + 5.5, DIM, 0.22, 0.5);
      for (let z = -130; z <= 75; z += 2.6) for (let x = -130; x <= 130; x += 11) addPt(x + 5.5, 0, z, DIM, 0.22, 0.5);
      // the Danube: a soft cyan curve far back
      for (let s = 0; s < 1; s += 0.0016) {
        const x = lerp(-150, 150, s), z = -95 + Math.sin(s * 5.2) * 14;
        for (let k = -2; k <= 2; k++) addPt(x, 0.2, z + k * 1.4, CYAN, 0.32, 0.18);
      }
      const cityGeo = new THREE.BufferGeometry();
      cityGeo.setAttribute("position", new THREE.Float32BufferAttribute(cityPos, 3));
      cityGeo.setAttribute("color", new THREE.Float32BufferAttribute(cityCol, 3));
      cityGeo.setAttribute("size", new THREE.Float32BufferAttribute(citySize, 1));
      cityGeo.setAttribute("alpha", new THREE.Float32BufferAttribute(cityAlpha, 1));
      const cityMat = pointMat(false);
      const city = new THREE.Points(cityGeo, cityMat);
      scene.add(city);
      const baseCityCol = Float32Array.from(cityCol);

      // ---------- the warm window (human) ----------
      const WIN = new THREE.Vector3(HERO.x + 1.2, 17.6, HERO.z + HERO.d / 2 + 0.05);
      const winGeo = new THREE.PlaneGeometry(1.5, 1.05);
      const winMat = new THREE.MeshBasicMaterial({ color: 0xffb35c, transparent: true, opacity: 0, fog: false });
      const win = new THREE.Mesh(winGeo, winMat); win.position.copy(WIN); scene.add(win);
      const glowTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, "rgba(255,190,110,1)"); gr.addColorStop(0.25, "rgba(255,170,80,0.35)"); gr.addColorStop(1, "rgba(255,150,60,0)");
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, transparent: true, opacity: 0, depthWrite: false, fog: false }));
      glow.position.copy(WIN).add(new THREE.Vector3(0, 0, 0.3)); glow.scale.set(9, 9, 1); scene.add(glow);

      // ---------- the swarm → iris (machine) ----------
      const N = 16000;
      const sPos = new Float32Array(N * 3), sFrom = new Float32Array(N * 3), sTo = new Float32Array(N * 3), sDelay = new Float32Array(N);
      const sCol = new Float32Array(N * 3), sSize = new Float32Array(N), sAlpha = new Float32Array(N); const ring_ = new Uint8Array(N);
      const IRIS_C = new THREE.Vector3(0, 62, -40), IRIS_R = 34;
      for (let i = 0; i < N; i++) {
        // origin: rooftops & streets across the city
        const b = buildings[Math.floor(rand() * buildings.length)];
        sFrom[i * 3] = b.x + (rand() - 0.5) * b.w; sFrom[i * 3 + 1] = rand() * b.h; sFrom[i * 3 + 2] = b.z + (rand() - 0.5) * b.d;
        // target: iris disc with radial fibres, pupil empty
        const ang = rand() * Math.PI * 2; const fibre = Math.floor(ang / (Math.PI * 2) * 180);
        const fa = (fibre + 0.5) / 180 * Math.PI * 2 + (rand() - 0.5) * 0.012;
        const rr = IRIS_R * (0.36 + Math.pow(rand(), 0.8) * 0.64);
        const ring = rand();
        if (ring < 0.12) { // limbus: dense bright outer ring
          const la = rand() * Math.PI * 2, lr = IRIS_R * (0.97 + rand() * 0.06);
          sTo[i * 3] = IRIS_C.x + Math.cos(la) * lr; sTo[i * 3 + 1] = IRIS_C.y + Math.sin(la) * lr; sTo[i * 3 + 2] = IRIS_C.z;
        } else if (ring < 0.2) { // pupil edge
          const la = rand() * Math.PI * 2, lr = IRIS_R * (0.34 + rand() * 0.03);
          sTo[i * 3] = IRIS_C.x + Math.cos(la) * lr; sTo[i * 3 + 1] = IRIS_C.y + Math.sin(la) * lr; sTo[i * 3 + 2] = IRIS_C.z;
        }
        ring_[i] = ring < 0.2 ? 1 : 0;
        const useFibre = rand() < 0.7;
        const a2 = useFibre ? fa : ang;
        if (ring >= 0.2) { sTo[i * 3] = IRIS_C.x + Math.cos(a2) * rr; sTo[i * 3 + 1] = IRIS_C.y + Math.sin(a2) * rr; sTo[i * 3 + 2] = IRIS_C.z + (rand() - 0.5) * 2.5; }
        // stagger: outward from the hero building (the impulse)
        const dx = sFrom[i * 3] - HERO.x, dz = sFrom[i * 3 + 2] - HERO.z;
        sDelay[i] = clamp(Math.hypot(dx, dz) / 160, 0, 1) * 0.9 + rand() * 0.25;
        const c = rand() < 0.12 ? new THREE.Color("#e8fbff") : CYAN;
        sCol[i * 3] = c.r; sCol[i * 3 + 1] = c.g; sCol[i * 3 + 2] = c.b;
        sSize[i] = 0.3 + rand() * 0.45; sAlpha[i] = 0;
      }
      const swarmGeo = new THREE.BufferGeometry();
      swarmGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
      swarmGeo.setAttribute("color", new THREE.BufferAttribute(sCol, 3));
      swarmGeo.setAttribute("size", new THREE.BufferAttribute(sSize, 1));
      swarmGeo.setAttribute("alpha", new THREE.BufferAttribute(sAlpha, 1));
      const swarmMat = pointMat(true);
      swarmMat.uniforms.uFogDensity.value = 0.003;
      const swarm = new THREE.Points(swarmGeo, swarmMat); scene.add(swarm);

      // ---------- grain ----------
      const gctx = document.getElementById("grain").getContext("2d");
      const gimg = gctx.createImageData(480, 270);
      const drawGrain = (frame) => {
        let s = (frame * 2654435761) >>> 0;
        for (let i = 0; i < gimg.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const n = (s >>> 24) - 128; const v = n > 0 ? 255 : 0; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = Math.abs(n) * 0.16; }
        gctx.putImageData(gimg, 0, 0);
      };

      // ---------- camera path ----------
      const camAt = (t) => {
        // shot 1: high, distant, almost black (counter owns the frame)
        const p0 = new THREE.Vector3(-30, 120, 210), l0 = new THREE.Vector3(0, 0, -20);
        // shot 2: glide down toward the hero window
        const p1 = new THREE.Vector3(WIN.x + 16, WIN.y + 6, WIN.z + 46), l1 = WIN.clone();
        // shot 3: slow push in during the hold
        const p2 = new THREE.Vector3(WIN.x + 9, WIN.y + 3.5, WIN.z + 30), l2 = WIN.clone().add(new THREE.Vector3(-0.5, 0.5, 0));
        // shot 4: pull back and up — iris above the whole city
        const p3 = new THREE.Vector3(-8, 40, 92), l3 = new THREE.Vector3(0, 52, -40);
        const p = new THREE.Vector3(), l = new THREE.Vector3();
        if (t < VO + 2.1) { const k = t / (VO + 2.1) * 0.06; p.lerpVectors(p0, p1, k); l.lerpVectors(l0, l1, k); }
        else if (t < VO + 6.7) { const k = 0.06 + 0.94 * inOut(smooth(VO + 2.1, VO + 6.7, t)); p.lerpVectors(p0, p1, k); l.lerpVectors(l0, l1, k); }
        else if (t < VO + 9.3) { const k = smooth(VO + 6.7, VO + 9.3, t); p.lerpVectors(p1, p2, k); l.lerpVectors(l1, l2, k); }
        else { const k = inOut(smooth(VO + 9.3, VO + 13.0, t)); const drift = Math.max(0, t - (VO + 13.0)) * 1.2;
          p.lerpVectors(p2, p3, k); p.z += drift; l.lerpVectors(l2, l3, k); }
        return { p, l };
      };

      // ---------- DOM refs ----------
      const year = document.getElementById("year"), tens = document.getElementById("tens"), ones = document.getElementById("ones");
      const yearLabel = document.querySelector("#yearLabel span");
      const tag = document.getElementById("tag"), tagRule = tag.querySelector(".rule"), tagT = tag.querySelectorAll(".t > span");

      const v3 = new THREE.Vector3();
      const render = (t) => {
        const frame = Math.round(t * 30);

        // --- year counter: rolls 2026 → 2031, lands on the spoken "2031" (VO+0.64) ---
        const roll = expoOut(smooth(0.15, VO + 0.75, t));
        tens.style.transform = `translateY(${-300 * smooth(0.5, VO + 0.6, t) * 1}px)`;
        ones.style.transform = `translateY(${-300 * 5 * roll}px)`;
        // counter centred, then shrinks into the top-left stamp as the city appears
        const shrink = inOut(smooth(VO + 1.7, VO + 3.0, t));
        const sc = lerp(1, 0.36, shrink);
        const yw = year.offsetWidth;
        const x = lerp(960 - yw / 2, 96, shrink), y = lerp(540 - 160, 74, shrink);
        const breathe = 1 + 0.012 * smooth(0, VO + 1.7, t);
        year.style.transform = `translate(${x}px, ${y}px) scale(${sc * breathe})`;
        year.style.opacity = 1 - 0.35 * smooth(VO + 3, VO + 4, t);
        const lab = expoOut(smooth(VO + 2.6, VO + 3.4, t));
        yearLabel.style.transform = `translateY(${(1 - lab) * 30}px)`; yearLabel.style.opacity = lab;

        // --- city reveal ---
        cityMat.uniforms.uOpacity.value = 0.1 + 0.9 * smooth(VO + 1.4, VO + 3.4, t);

        // --- the window: lights up as the camera arrives, label hands off, switches off on "screen" (VO+6.56) ---
        const on = smooth(VO + 3.3, VO + 4.1, t);
        const offT = VO + 6.62;
        let off = 0; if (t > offT) { const k = t - offT; off = k < 0.06 ? 0.6 : k < 0.11 ? 0.15 : k < 0.16 ? 0.75 : clamp(0.75 + (k - 0.16) * 3, 0, 1); }
        const lit = on * (1 - off);
        winMat.opacity = lit; glow.material.opacity = lit * 0.95;
        glow.scale.setScalar(9 + 1.5 * Math.sin(t * 1.3) * lit);

        // label anchored to the window in screen space
        const cam = camAt(t); camera.position.copy(cam.p); camera.lookAt(cam.l); camera.updateMatrixWorld();
        v3.copy(WIN).project(camera);
        const sx = (v3.x * 0.5 + 0.5) * 1920, sy = (-v3.y * 0.5 + 0.5) * 1080;
        tag.style.left = `${sx + 150}px`; tag.style.top = `${sy - 16}px`;
        const tagIn = expoOut(smooth(VO + 4.2, VO + 5.0, t)), tagOut = smooth(VO + 6.7, VO + 7.3, t);
        tagRule.style.transform = `scaleX(${tagIn * (1 - tagOut)})`;
        tagT.forEach((s, i) => { const k = expoOut(smooth(VO + 4.35 + i * 0.12, VO + 5.15 + i * 0.12, t)); s.style.transform = `translateY(${(1 - k) * 110 + tagOut * -110}%)`; });

        // --- swarm: city points lift and assemble into an iris on "something learned to see" ---
        const sStart = VO + 9.35, sDur = 2.3;
        const open = expoOut(smooth(VO + 10.3, VO + 11.6, t)); // eyelid opens on "see"
        for (let i = 0; i < N; i++) {
          const k = clamp((t - sStart - sDelay[i] * 0.9) / sDur, 0, 1);
          const e = inOut(k);
          const fx = sFrom[i * 3], fy = sFrom[i * 3 + 1], fz = sFrom[i * 3 + 2];
          const tx = sTo[i * 3], tyRaw = sTo[i * 3 + 1], tz = sTo[i * 3 + 2];
          // eyelid: compress vertically until open
          const ty = IRIS_C.y + (tyRaw - IRIS_C.y) * lerp(0.08, 1, open);
          // arc: rise first, then sweep in
          const lift = Math.sin(e * Math.PI) * 18;
          sPos[i * 3] = lerp(fx, tx, e); sPos[i * 3 + 1] = lerp(fy, ty, e) + lift; sPos[i * 3 + 2] = lerp(fz, tz, e);
          // slow rotation of the finished iris (moving hold)
          if (e > 0.98) {
            const a = (t - (VO + 11.6)) * 0.05; const ox = sPos[i * 3] - IRIS_C.x, oy = sPos[i * 3 + 1] - IRIS_C.y;
            sPos[i * 3] = IRIS_C.x + ox * Math.cos(a) - oy * Math.sin(a); sPos[i * 3 + 1] = IRIS_C.y + ox * Math.sin(a) + oy * Math.cos(a);
          }
          sAlpha[i] = smooth(0, 0.12, k) * (0.38 + 0.32 * open) * (ring_[i] ? 1.8 : 1);
        }
        swarmGeo.attributes.position.needsUpdate = true; swarmGeo.attributes.alpha.needsUpdate = true;

        // city dims as its light leaves for the iris, then a cyan scan sweeps it on "better than all of us"
        const scanY = lerp(-10, 40, smooth(VO + 11.9, VO + 13.2, t));
        const ca = cityGeo.attributes.color.array;
        const scanOn = t > VO + 11.8;
        for (let i = 0, j = 0; i < ca.length; i += 3, j++) {
          const z = cityPos[j * 3 + 2];
          const band = scanOn ? Math.exp(-Math.pow((z + 60 - scanY * 3) / 14, 2)) : 0;
          const dim = 1 - 0.45 * smooth(VO + 9.3, VO + 11.5, t);
          ca[i] = baseCityCol[i] * dim + CYAN.r * band * 0.8; ca[i + 1] = baseCityCol[i + 1] * dim + CYAN.g * band * 0.8; ca[i + 2] = baseCityCol[i + 2] * dim + CYAN.b * band * 0.8;
        }
        cityGeo.attributes.color.needsUpdate = true;

        bloom.strength = 0.55 + 0.35 * smooth(VO + 10.8, VO + 11.8, t);
        composer.render();
        drawGrain(frame);
      };

      // GSAP drives time; the setter renders every seeked frame deterministically
      const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; render(v); } };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: 15, duration: 15, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      render(0);
    </script>
  </body>
</html>
