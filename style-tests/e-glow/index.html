<!doctype html>
<html><head><meta charset="utf-8"><title>e-glow · Film 4 hook in reference style</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Style test E "glow": gradient silhouettes, rim light, depth-of-field blur, light-line carrier.
// One continuous space: desk at night -> the screen's light leaves, circles you, becomes a sun ->
// the sun pours out an income line that runs across your whole life (age axis 30-90).
// Everything is drawn in Canvas2D; render(t) is pure, so any frame can be rendered in any order.
const W = 1920, H = 1080, DUR = 11.4;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
const mask = mk(), mctx = mask.getContext("2d"), tint = mk(), tctx = tint.getContext("2d");

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const eio = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, k, al = 1) => { const A = hex(a), B = hex(b); return `rgba(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(",")},${al})`; };
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// ---------- camera: Catmull-Rom through keys (t, x, y, zoom) ----------
const KEYS = [[0, 40, 150, 1.5], [2.6, 20, 140, 1.62], [4.6, 0, 125, 1.85], [6.5, 60, 30, 1.0],
  [8.6, 760, -40, 0.74], [11.4, 1300, 30, 0.6]];
function cam(t) {
  t = clamp(t, 0, DUR);
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const k0 = KEYS[Math.max(0, i - 1)], k1 = KEYS[i], k2 = KEYS[i + 1], k3 = KEYS[Math.min(KEYS.length - 1, i + 2)];
  const u = eio(clamp((t - k1[0]) / (k2[0] - k1[0])));
  const cr = (j) => { const p0 = k0[j], p1 = k1[j], p2 = k2[j], p3 = k3[j];
    const m1 = (p2 - p0) / 2, m2 = (p3 - p1) / 2, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * p1 + (u3 - 2 * u2 + u) * m1 * .6 + (-2 * u3 + 3 * u2) * p2 + (u3 - u2) * m2 * .6; };
  // a slow handheld-free drift so the frame never freezes
  return { x: cr(1) + Math.sin(t * .7) * 4, y: cr(2) + Math.sin(t * .53) * 3, z: cr(3) };
}
// parallax plane p: 1 = figure plane, <1 far, >1 near
function setPlane(c, C, p) {
  const s = Math.pow(C.z, p);
  c.setTransform(s, 0, 0, s, W / 2 - C.x * p * s, H / 2 - C.y * p * s);
}
const toScreen = (C, p, x, y) => { const s = Math.pow(C.z, p); return [W / 2 + (x - C.x * p) * s, H / 2 + (y - C.y * p) * s]; };

// ---------- palette: night -> dawn ----------
const NIGHT = { top: "#07031d", mid: "#1a0a52", hor: "#3b1c9e", glow: "#3ff0e0", dune: ["#2a1170", "#1a0a4c", "#0f0634"], floor: "#0b0428" };
const DAWN = { top: "#3d17a6", mid: "#e2457e", hor: "#fff0e4", glow: "#fff4ea", dune: ["#d4569a", "#8a32c8", "#4a1ba0"], floor: "#5a1fb0" };

// ---------- scene data ----------
const GROUND = 300, SUN = { x: 0, y: 60, r: 210 };
const tasks = Array.from({ length: 18 }, (_, i) => ({
  x: (rnd() - .5) * 1500, y: -260 + rnd() * 470, w: 50 + rnd() * 110, h: 36 + rnd() * 70,
  p: .55 + rnd() * 1.1, rot: (rnd() - .5) * .25, g: i % 3, ph: rnd() * 6, lift: 260 + rnd() * 380, delay: rnd() * .7 }));
tasks.push({ x: 380, y: 40, w: 300, h: 190, p: 2.1, rot: .08, g: 1, ph: 1, lift: 500, delay: .1 }); // big DOF foreground card
const GRADS = [["#ff7aa8", "#6b39e6"], ["#58e8ff", "#5b2bd6"], ["#ffb38a", "#c43fa0"]];
const bokeh = Array.from({ length: 16 }, (_, i) => ({
  x: -300 + rnd() * 3300, y: [-780, -640, -580, -110, 30, 150][i % 6] + rnd() * 90, r: 14 + rnd() * 46, p: .6 + rnd() * 1.2,
  kind: i % 4 === 0 ? "diamond" : "sphere", g: i % 3, ph: rnd() * 6 }));
const AGE0 = 360, DEC = 390, LINE_Y = -330; // age 30 at x=360, 90 at x=2700

// ---------- drawing helpers ----------
function sky(C, t, k) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const [, hy] = toScreen(C, .25, 0, GROUND);
  const hk = clamp(hy / H, .2, .98);
  g.addColorStop(0, mix(NIGHT.top, DAWN.top, k)); g.addColorStop(hk * .62, mix(NIGHT.mid, DAWN.mid, k));
  g.addColorStop(hk, mix(NIGHT.hor, DAWN.hor, k)); g.addColorStop(1, mix(NIGHT.floor, DAWN.floor, k));
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // horizon glow (cyan at night: the screen; cream at dawn: the sun)
  const [gx, gy] = toScreen(C, .5, 0, GROUND);
  const rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 900 * C.z);
  rg.addColorStop(0, mix(NIGHT.glow, DAWN.glow, k, .55)); rg.addColorStop(.35, mix(NIGHT.glow, "#ffb08a", k, .18)); rg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.save(); ctx.translate(gx, gy); ctx.scale(1, .32); ctx.translate(-gx, -gy);
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H * 4); ctx.restore();
}
function dune(C, t, k, p, base, amp, f, col, blur, seed) {
  setPlane(ctx, C, p);
  ctx.filter = blur ? `blur(${blur}px)` : "none";
  const x0 = -2400, x1 = 4200;
  ctx.beginPath(); ctx.moveTo(x0, 2000);
  for (let x = x0; x <= x1; x += 30)
    ctx.lineTo(x, base - amp * (.55 * Math.sin(x * f + seed) + .3 * Math.sin(x * f * 2.3 + seed * 2) + .15 * Math.sin(x * f * 5.1 + seed)));
  ctx.lineTo(x1, 2000); ctx.closePath();
  const g = ctx.createLinearGradient(0, base - amp, 0, base + 260);
  g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g; ctx.fill(); ctx.filter = "none";
}
function card(c, x, y, w, h, rot, grad, alpha) {
  c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = alpha;
  const g = c.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, grad[0]); g.addColorStop(1, grad[1]);
  c.fillStyle = g; c.fillRect(-w / 2, -h / 2, w, h);
  c.fillStyle = "rgba(255,255,255,.55)"; c.fillRect(-w / 2, -h / 2, w, 3); // lit top edge
  c.restore();
}

// ---------- figure ----------
// angles: 0 = limb points down, + = toward +x. Torso angle: 0 = upright, + = leaning forward (+x).
const L = { torso: 104, neck: 14, ua: 60, fa: 56, th: 78, sh: 80 };
function pose(t) {
  const up = eio(ss(2.55, 3.7, t)); // sit -> stand on "never have to work"
  const type = (1 - up) * Math.sin(t * 19) * .07;
  const P = {
    th: [lerp(1.5, .05, up), lerp(1.42, -.05, up)], sh: [lerp(.06, 0, up), lerp(.02, .02, up)],
    torso: lerp(.16, -.02, up) + Math.sin(t * 1.3) * .012,
    ua: [lerp(.62, -.14, up), lerp(.5, .16, up)], fa: [lerp(1.35, .02, up) + type, lerp(1.25, .2, up) - type],
    head: lerp(.12, 0, up),
  };
  // look up toward the sun, then raise the near arm toward the income line
  P.head -= .32 * ss(4.6, 5.8, t);
  const reach = eio(ss(6.3, 7.4, t));
  P.ua[1] = lerp(P.ua[1], 2.25, reach); P.fa[1] = lerp(P.fa[1], 2.45, reach);
  P.torso -= .06 * reach;
  // feet stay planted at x=0 on the ground: solve hip from the legs
  P.hx = -(L.th * Math.sin(P.th[0]) + L.sh * Math.sin(P.sh[0]));
  P.hy = GROUND - L.th * Math.cos(P.th[0]) - L.sh * Math.cos(P.sh[0]);
  return P;
}
function seg(c, x, y, a, len, w0, w1) {
  const x2 = x + Math.sin(a) * len, y2 = y + Math.cos(a) * len;
  const nx = Math.cos(a), ny = -Math.sin(a);
  c.beginPath();
  c.moveTo(x + nx * w0 / 2, y + ny * w0 / 2); c.lineTo(x2 + nx * w1 / 2, y2 + ny * w1 / 2);
  c.lineTo(x2 - nx * w1 / 2, y2 - ny * w1 / 2); c.lineTo(x - nx * w0 / 2, y - ny * w0 / 2); c.fill();
  c.beginPath(); c.arc(x, y, w0 / 2, 0, 7); c.fill(); c.beginPath(); c.arc(x2, y2, w1 / 2, 0, 7); c.fill();
  return [x2, y2];
}
function silhouette(c, P) {
  c.fillStyle = "#fff";
  const sx = P.hx + Math.sin(P.torso) * L.torso, sy = P.hy - Math.cos(P.torso) * L.torso;
  // legs (far leg first)
  for (const i of [1, 0]) {
    const [kx, ky] = seg(c, P.hx + (i ? 4 : -4), P.hy, P.th[i], L.th, 30, 21);
    const [fx, fy] = seg(c, kx, ky, P.sh[i], L.sh, 21, 14);
    c.beginPath(); c.ellipse(fx + 9, fy - 2, 17, 7, 0, 0, 7); c.fill(); // shoe
  }
  // torso: rounded shoulders, narrower waist
  c.save(); c.translate(P.hx, P.hy); c.rotate(P.torso);
  c.beginPath();
  c.moveTo(-21, 4); c.quadraticCurveTo(-24, -50, -27, -L.torso + 14);
  c.quadraticCurveTo(-27, -L.torso - 2, -10, -L.torso - 4); c.lineTo(10, -L.torso - 4);
  c.quadraticCurveTo(27, -L.torso - 2, 27, -L.torso + 14);
  c.quadraticCurveTo(24, -50, 21, 4); c.closePath(); c.fill();
  c.restore();
  // neck + head
  const ha = P.torso + P.head;
  const nx = sx + Math.sin(ha) * L.neck, ny = sy - Math.cos(ha) * L.neck;
  seg(c, sx, sy + 2, Math.PI + ha, L.neck + 4, 13, 12);
  c.save(); c.translate(nx + Math.sin(ha) * 17, ny - Math.cos(ha) * 17); c.rotate(ha);
  c.beginPath(); c.ellipse(0, 0, 15.5, 19.5, 0, 0, 7); c.fill(); c.restore();
  // arms
  for (const i of [0, 1]) {
    const ox = sx + Math.cos(P.torso) * (i ? 15 : -15), oy = sy + 6 + Math.sin(P.torso) * (i ? 15 : -15);
    const [ex, ey] = seg(c, ox, oy, P.ua[i], L.ua, 16, 12);
    seg(c, ex, ey, P.fa[i], L.fa, 12, 9);
  }
}
function drawFigure(C, t, k) {
  const P = pose(t);
  for (const c of [mctx, tctx]) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H); }
  setPlane(mctx, C, 1); silhouette(mctx, P);
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  const s = C.z;
  // rim: night = cyan from the monitor on the right, dawn = cream from the sun behind
  const rimOff = [lerp(4.5, -3.5, k) * s, lerp(-1, -2.5, k) * s];
  tctx.drawImage(mask, 0, 0); tctx.globalCompositeOperation = "source-in";
  tctx.fillStyle = mix("#7ff6ff", "#fff2e6", k); tctx.fillRect(0, 0, W, H); tctx.globalCompositeOperation = "source-over";
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(tint, rimOff[0], rimOff[1]);
  if (k > .2) ctx.drawImage(tint, 3 * s, -1 * s); // dawn: thin second rim (sun wraps around)
  // body gradient
  tctx.clearRect(0, 0, W, H); tctx.drawImage(mask, 0, 0); tctx.globalCompositeOperation = "source-in";
  const [, top] = toScreen(C, 1, 0, P.hy - 200), [, bot] = toScreen(C, 1, 0, GROUND);
  const g = tctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, mix("#2b1466", "#5b2bd0", k)); g.addColorStop(.55, mix("#1c0c4e", "#b0359a", k)); g.addColorStop(1, mix("#0d0530", "#ff5a6e", k));
  tctx.fillStyle = g; tctx.fillRect(0, 0, W, H); tctx.globalCompositeOperation = "source-over";
  ctx.drawImage(tint, 0, 0);
}

// ---------- desk (dissolves after "work") ----------
function desk(C, t) {
  const gone = ss(3.6, 4.7, t); if (gone >= 1) return;
  setPlane(ctx, C, 1);
  ctx.save(); ctx.globalAlpha = 1 - gone; ctx.translate(0, gone * 40);
  if (gone > 0) ctx.filter = `blur(${gone * 8}px)`;
  const on = 1 - ss(3.42, 3.6, t); // monitor clicks off on "work"
  // screen light pool on the desk + figure
  if (on > 0) {
    const rg = ctx.createRadialGradient(70, 170, 0, 70, 170, 260);
    rg.addColorStop(0, `rgba(80,240,255,${.45 * on})`); rg.addColorStop(1, "rgba(80,240,255,0)");
    ctx.fillStyle = rg; ctx.fillRect(-250, -100, 600, 450);
  }
  ctx.fillStyle = "#0b0430";
  ctx.fillRect(-30, 206, 190, 9); ctx.fillRect(-20, 215, 7, 85); ctx.fillRect(142, 215, 7, 85); // table
  ctx.fillRect(62, 188, 8, 18); ctx.fillRect(44, 202, 44, 5); // monitor stand
  ctx.fillRect(28, 126, 76, 64);
  const sg = ctx.createLinearGradient(32, 130, 100, 186);
  sg.addColorStop(0, mix("#0b0430", "#9ffcff", on)); sg.addColorStop(1, mix("#0b0430", "#3fd0ff", on));
  ctx.fillStyle = sg; ctx.fillRect(31, 129, 70, 58); // screen (faces us a little)
  ctx.fillStyle = "#0b0430";
  ctx.fillRect(-126, 216, 76, 8); ctx.fillRect(-92, 224, 6, 76); ctx.fillRect(-126, 138, 7, 82); // chair
  ctx.restore(); ctx.filter = "none";
}

// ---------- the light line: screen light -> orbit -> circle -> sun ----------
function spark(tau) {
  if (tau < 3.5) return { x: 66, y: 158, z: 1 };
  if (tau < 3.95) { const u = eio((tau - 3.5) / .45); return { x: lerp(66, 130, u), y: lerp(158, 210, u), z: 1 }; }
  const w = 2 * Math.PI / .95, a = (tau - 3.95) * w;
  const m = eio(ss(4.85, 5.85, tau));
  const cy = lerp(lerp(230, 40, eio(ss(3.95, 5.0, tau))), SUN.y, m);
  const rx = lerp(130, SUN.r, m), ry = lerp(30, SUN.r, m);
  return { x: SUN.x + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, z: m > .6 ? -1 : Math.sin(a) };
}
function lightLine(C, t, front) {
  if (t < 3.45 || t > 6.9) return;
  const fade = 1 - ss(6.2, 6.9, t);
  const trail = lerp(.35, .96, ss(4.3, 5.85, t));
  setPlane(ctx, C, 1);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  const N = 90;
  let prev = spark(t - trail);
  for (let i = 1; i <= N; i++) {
    const tau = t - trail + trail * i / N, p = spark(tau);
    const isFront = (p.z + prev.z) / 2 > 0;
    if (isFront === front) {
      const a = (i / N) * fade;
      ctx.strokeStyle = `rgba(255,80,110,${.45 * a})`; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.strokeStyle = `rgba(255,236,226,${.95 * a})`; ctx.lineWidth = 3.2; ctx.stroke();
    }
    prev = p;
  }
  const h = spark(t);
  if ((h.z > 0) === front && fade > 0) { // bright head
    const rg = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 34);
    rg.addColorStop(0, `rgba(255,245,235,${fade})`); rg.addColorStop(.3, `rgba(255,110,130,${.6 * fade})`); rg.addColorStop(1, "rgba(255,80,110,0)");
    ctx.fillStyle = rg; ctx.fillRect(h.x - 40, h.y - 40, 80, 80);
  }
  ctx.restore();
}
function sun(C, t) {
  const k = ss(5.55, 6.6, t); if (k <= 0) return;
  setPlane(ctx, C, .94);
  const r = SUN.r * lerp(.92, 1, eout(k));
  ctx.save(); ctx.globalAlpha = k;
  const halo = ctx.createRadialGradient(SUN.x, SUN.y, r * .8, SUN.x, SUN.y, r * 3.2);
  halo.addColorStop(0, "rgba(255,190,160,.55)"); halo.addColorStop(1, "rgba(255,120,140,0)");
  ctx.fillStyle = halo; ctx.fillRect(SUN.x - r * 3.3, SUN.y - r * 3.3, r * 6.6, r * 6.6);
  const g = ctx.createRadialGradient(SUN.x - r * .25, SUN.y - r * .3, r * .05, SUN.x, SUN.y, r);
  g.addColorStop(0, "#fffaf2"); g.addColorStop(.45, "#ffc79c"); g.addColorStop(.85, "#ff6f7f"); g.addColorStop(1, "#e2457e");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(SUN.x, SUN.y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,240,230,.85)"; ctx.lineWidth = 3; ctx.stroke(); // the light line, now the sun's rim
  ctx.restore();
}

// ---------- infographic: income across a lifetime ----------
// the line leaves the sun at its upper right and runs flat across the age axis
const PATH = (() => {
  const pts = [], a0 = -1.25;
  const p0 = [SUN.x + Math.cos(a0) * SUN.r, SUN.y + Math.sin(a0) * SUN.r];
  const c1 = [p0[0] + 50, p0[1] - 150], c2 = [AGE0 - 170, LINE_Y], p3 = [AGE0, LINE_Y];
  for (let i = 0; i <= 40; i++) { const u = i / 40, v = 1 - u;
    pts.push([v * v * v * p0[0] + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u * u * u * p3[0],
      v * v * v * p0[1] + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u * u * u * p3[1]]); }
  for (let x = AGE0 + 30; x <= AGE0 + 6 * DEC + 120; x += 30) pts.push([x, LINE_Y]);
  let acc = 0; pts[0][2] = 0;
  for (let i = 1; i < pts.length; i++) { acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); pts[i][2] = acc; }
  return pts;
})();
const PLEN = PATH[PATH.length - 1][2];
function headLen(t) { // income line grows with the VO: fast on "taken care of", steady through "rest of your life"
  const a = eio(ss(6.35, 8.0, t)) * (AGE0 + 1.3 * DEC), b = eio(ss(8.0, 10.9, t)) * (PLEN - AGE0 - 1.3 * DEC);
  return Math.min(PLEN, a + b);
}
function pointAt(len) {
  for (let i = 1; i < PATH.length; i++) if (PATH[i][2] >= len) {
    const u = (len - PATH[i - 1][2]) / (PATH[i][2] - PATH[i - 1][2]);
    return [lerp(PATH[i - 1][0], PATH[i][0], u), lerp(PATH[i - 1][1], PATH[i][1], u)];
  }
  return PATH[PATH.length - 1];
}
function chart(C, t) {
  if (t < 6.3) return;
  const hl = headLen(t), [hx, hy] = pointAt(hl);
  setPlane(ctx, C, 1);
  ctx.save();
  // area under the flat part: the income that is "taken care of"
  if (hx > AGE0) {
    const g = ctx.createLinearGradient(0, LINE_Y, 0, GROUND);
    g.addColorStop(0, "rgba(255,120,140,.38)"); g.addColorStop(.6, "rgba(255,170,150,.12)"); g.addColorStop(1, "rgba(255,200,170,0)");
    ctx.fillStyle = g; ctx.fillRect(AGE0, LINE_Y, hx - AGE0, GROUND - LINE_Y);
  }
  ctx.restore(); chartLine(C, t, hl, hx, hy);
}
function chartAxis(C, t) {
  if (t < 6.3) return;
  const hl = headLen(t), [hx] = pointAt(hl);
  setPlane(ctx, C, 1); ctx.save();
  const ax = ss(6.9, 7.6, t);
  ctx.strokeStyle = `rgba(255,244,234,${.55 * ax})`; ctx.lineWidth = 2 / C.z;
  ctx.beginPath(); ctx.moveTo(AGE0 - 60, GROUND); ctx.lineTo(lerp(AGE0 - 60, AGE0 + 6 * DEC + 140, eio(ax)), GROUND); ctx.stroke();
  ctx.font = `500 ${30 / C.z}px Inter`; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let d = 0; d <= 6; d++) {
    const x = AGE0 + d * DEC, on = hx >= x - 2 ? eout(clamp((t - tickT[d]) / .45)) : 0;
    if (on <= 0) continue;
    ctx.globalAlpha = on;
    ctx.fillStyle = "rgba(255,244,234,.9)"; ctx.fillRect(x - 1 / C.z, GROUND - 10 / C.z, 2 / C.z, 20 / C.z * on);
    ctx.fillText(String(30 + d * 10), x, GROUND + 22 / C.z + (1 - on) * 10);
    // dashed drop line from the income line to the axis
    ctx.strokeStyle = "rgba(255,244,234,.28)"; ctx.setLineDash([4 / C.z, 7 / C.z]); ctx.lineWidth = 1.5 / C.z;
    ctx.beginPath(); ctx.moveTo(x, LINE_Y + 14); ctx.lineTo(x, LINE_Y + 14 + (GROUND - LINE_Y - 24) * on); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = ss(9.0, 9.8, t);
  ctx.textAlign = "left"; ctx.fillStyle = "rgba(255,244,234,.7)";
